name: build-clover-windows-uefi

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout this repo (carries CloverGopDxe source + patch script)
        uses: actions/checkout@v4

      - name: Clone edk2-msm
        run: |
          git config --global url."https://gh-proxy.com/https://github.com/".insteadOf "https://github.com/"
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            https://gh-proxy.com/https://github.com/edk2-porting/edk2-msm.git edk2-msm 2>&1 | tail -20

      - name: Apply CloverGopDxe patch
        run: |
          bash patch-gop.sh "$GITHUB_WORKSPACE/edk2-msm" "$GITHUB_WORKSPACE"
          echo "=== verify patch ==="
          grep -n "CloverGopDxe" edk2-msm/Platform/Qualcomm/sdm660/sdm660.dsc
          grep -n "CloverGopDxe" edk2-msm/Platform/Qualcomm/sdm660/dxe.fdf.inc

      - name: Install build deps
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -q
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential uuid-dev clang llvm iasl nasm gcc-aarch64-linux-gnu \
            abootimg python3-pil python3-git gettext mtools dosfstools \
            device-tree-compiler zip unzip ca-certificates

      - name: Build clover (sdm660) UEFI
        run: |
          set -e
          cd edk2-msm
          touch ramdisk
          # do NOT use --skip-rootfs-gen: SimpleInitRootFS.inf needs build/rootfs.c
          ./build.sh --device clover > "$GITHUB_WORKSPACE/build-output.txt" 2>&1 || {
            echo "BUILD_FAILED_MARKER"
            tail -80 "$GITHUB_WORKSPACE/build-output.txt"
            exit 1
          }
          echo "BUILD_OK"
          tail -30 "$GITHUB_WORKSPACE/build-output.txt"

      - name: Locate output image
        if: always()
        run: |
          echo "=== all .img / .fd / boot* files ==="
          find edk2-msm -maxdepth 5 \( -name "*.img" -o -name "*.fd" -o -name "boot*" \) 2>/dev/null | head -40
          echo "=== collect into out/ ==="
          mkdir -p out
          find edk2-msm \( -name "*.img" -o -name "*.fd" \) -exec cp {} out/ \; 2>/dev/null
          cp build-output.txt out/ 2>/dev/null || true
          ls -la out/

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clover-windows-uefi
          path: out/**
          if-no-files-found: warn
